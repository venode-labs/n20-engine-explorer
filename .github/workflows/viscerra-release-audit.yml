name: Viscerra release audit

on:
  push:
    branches: [viscerra-takeover, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viscerra-release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Static release gate
        run: npm run release:gate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser visual audit
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/viscerra-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/viscerra-dev.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          npm run visual:audit

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viscerra-visual-audit-${{ github.sha }}
          path: |
            audit/visual/**
            /tmp/viscerra-dev.log
          if-no-files-found: warn
          retention-days: 30
